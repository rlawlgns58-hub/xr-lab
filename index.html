<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XR 과학 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: calm lab instrument, plain words for students
   IDEA: a lab bench with an instruction tablet on one side and a results board on the other
   PICTURE: the live 3D bench fills the whole screen
   COLOUR and TYPE: porcelain-white cards, ink #13201c, BTB teal #0e7a66 accent; Noto Sans KR
   LAYOUT: full-bleed canvas, card top-left, results panel right, control strip bottom, stacks on phones */
:root{color-scheme:light dark;--card:light-dark(rgba(252,252,250,.92),rgba(18,26,24,.9));--ink:light-dark(#13201c,#e8efec);--sub:light-dark(#4d5a56,#a9b7b2);--line:light-dark(rgba(19,32,28,.13),rgba(232,239,236,.15));--acc:#0e7a66;--acc2:light-dark(#0b6655,#4cc3a8);--btn:light-dark(#eef2f0,#22302c);--ok:#1f8f5f;--bad:#c4412f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd8dc}
body{color:var(--ink);font:16px/1.5 'Noto Sans KR',system-ui,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(10,30,25,.16)}
.intro{position:fixed;top:16px;left:16px;width:min(390px,calc(100vw - 32px));padding:16px 18px 12px;z-index:3}
.ihead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.intro h1{margin:0;font-size:24px;line-height:1.2;font-weight:900}
.lv{margin:2px 0 10px;font-weight:700;color:var(--acc2);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
button[aria-pressed=true]{background:var(--acc2);color:light-dark(#fff,#08201a);border-color:transparent}
#btnFold{min-height:36px;padding:0 12px;font-size:13px;flex:none}
.note{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--sub)}
.intro.min .note,.intro.min details{display:none}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
details ul{margin:6px 0 2px;padding-left:18px;color:var(--sub)}
details li{margin:3px 0}
details b{color:var(--ink)}
.bar{position:fixed;left:16px;right:16px;bottom:16px;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;z-index:3}
.status{position:fixed;right:16px;top:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;width:min(360px,calc(100vw - 32px));font-size:14px;z-index:3}
#statusText{color:var(--sub)}
#readText{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
#drawer{position:fixed;top:96px;right:16px;bottom:92px;width:min(470px,calc(100vw - 32px));padding:16px 18px;z-index:4;display:flex;flex-direction:column;gap:10px}
#drawer[hidden]{display:none}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh h2{margin:0;font-size:21px;font-weight:900}
.dh .row button{min-height:38px;padding:0 12px;font-size:14px}
label.nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
label.nm input{flex:1;font:inherit;font-size:16px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink)}
#dBody{overflow:auto;flex:1;padding-right:4px}
.cond{margin:0;font-size:13.5px;color:var(--sub)}
.sec{font-weight:800;margin:14px 0 6px;font-size:15px}
.scroll{overflow-x:auto}
#dBody table{width:100%;border-collapse:collapse;font-size:14px}
#dBody th{font-size:12.5px;color:var(--sub);font-weight:700}
#dBody th,#dBody td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#dBody th:first-child,#dBody td:first-child{text-align:left}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);margin-right:6px;vertical-align:-1px}
.empty{color:var(--sub);font-size:14px;margin:4px 0}
.cl{margin:6px 0;line-height:2.1;font-size:15px}
.cl select{font:inherit;font-size:16px;min-height:36px;border-radius:8px;border:2px solid var(--line);background:var(--btn);color:var(--ink);padding:0 4px}
.cl select.ok{border-color:var(--ok)}.cl select.bad{border-color:var(--bad)}
.cmsg{font-size:14px;font-weight:700;margin:4px 0}
.cmsg.ok{color:var(--ok)}.cmsg.bad{color:var(--bad)}
.mis{list-style:none;padding:0;margin:4px 0 8px}
.mis li{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:14.5px}
.mis i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;margin-top:1px}
.mis li.ok i{background:var(--acc);border-color:var(--acc)}
.mis li.ok span{color:var(--sub)}
.pred{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0;font-size:14.5px}
.pred span{flex:1 1 160px}
.pred button{min-height:38px;padding:0 12px;font-size:14px}
.graph{width:100%;height:auto;display:block;background:light-dark(#fff,#101816);border-radius:12px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(18,30,27,.38);z-index:8;padding:16px}
.modal[hidden]{display:none}
.mcard{width:min(640px,100%);padding:24px 24px 20px;max-height:calc(100vh - 32px);overflow:auto}
.mcard h2{margin:0 0 6px;font-size:30px;font-weight:900;line-height:1.15}
.mcard>p{margin:0 0 16px;color:var(--sub)}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;min-height:170px;border-radius:16px;border:2px solid var(--line);background:var(--btn)}
.pick svg{width:100%;height:70px}
.pick b{font-size:18px}.pick span{font-size:13.5px;font-weight:500;color:var(--sub);line-height:1.4}
.pick[aria-checked=true]{border-color:var(--acc);background:light-dark(#e3f3ee,#173a32)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:5px;border-radius:14px;background:var(--btn);margin-bottom:10px}
.seg button{border:0;background:transparent}
.seg button[aria-checked=true]{background:var(--acc);color:#fff}
#lvDesc{min-height:48px;margin:0 0 14px;font-size:15px;color:var(--sub)}
.big{width:100%;min-height:52px;font-size:17px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#dfe6e8;z-index:9;transition:opacity .5s}
#loading p{margin:14px 0 0;font-weight:700;color:#3b4a46}
.spin{width:44px;height:44px;margin:auto;border-radius:50%;border:4px solid #b9cbc6;border-top-color:#0e7a66;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:760px){.status{top:auto;bottom:calc(16px + 118px);left:16px;width:auto;flex-direction:row;justify-content:space-between;align-items:center}#drawer{top:16px;bottom:16px;z-index:6}.picks{grid-template-columns:1fr}.pick{min-height:0}}
@media(max-width:520px){.bar{bottom:8px;gap:6px;padding:8px}.bar button{padding:0 11px;font-size:14px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="loading"><div><div class="spin"></div><p>실험실을 준비하고 있어요…</p></div></div>
<header class="card intro">
  <div class="ihead"><div><h1 id="expTitle">중화 반응</h1><p class="lv" id="expLv">초급</p></div><button id="btnFold" aria-expanded="true">접기</button></div>

    <button id="btnVR" class="primary" disabled>VR로 들어가기</button>

  <details><summary>조작 방법</summary><ul id="helpList"></ul></details>
</header>
<div class="card status"><span id="statusText">실험을 골라 시작하세요.</span><span id="readText">–</span></div>
<nav class="card bar" id="bar" aria-label="실험 도구"></nav>
<aside id="drawer" class="card" hidden aria-label="탐구 결과 기록">
  <div class="dh"><h2>탐구 결과 기록</h2><div class="row"><button id="dUndo">되돌리기</button><button id="dRedo">다시 실행</button><button id="dClose">닫기</button></div></div>
  <label class="nm">이름 <input id="nameIn" maxlength="12" autocomplete="off" placeholder="기록지에 들어갈 이름"></label>
  <div id="dBody"></div>
  <div class="row"><button id="btnCopy">표 복사</button><button id="btnCsv">CSV 저장</button></div>
</aside>
<div id="start" class="modal">
  <div class="card mcard" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">XR 과학 실험실</h2>
    <p>실험과 단계를 고르세요. 헤드셋에서는 시작한 뒤 VR 버튼을 누르면 됩니다.</p>
    <div class="picks" role="radiogroup" aria-label="실험">
      <button class="pick" role="radio" data-exp="acid" aria-checked="true">
        <svg viewBox="0 0 220 70" aria-hidden="true"><rect x="40" y="26" width="140" height="38" rx="9" fill="#f7f7f3" stroke="#c9d3cf" stroke-width="2"/><circle cx="68" cy="45" r="10" fill="#f2c230"/><circle cx="98" cy="45" r="10" fill="#3f9a63"/><circle cx="128" cy="45" r="10" fill="#2a63d6"/><circle cx="158" cy="45" r="10" fill="#e2489c"/><rect x="92" y="2" width="12" height="14" rx="5" fill="#2a63d6"/><rect x="96.5" y="15" width="3" height="10" fill="#9fb3bb"/></svg>
        <b>중화 반응</b><span>산과 염기를 홈판에 섞고 지시약 색과 온도 변화를 관찰해요.</span>
      </button>
      <button class="pick" role="radio" data-exp="em" aria-checked="false">
        <svg viewBox="0 0 220 70" aria-hidden="true"><rect x="30" y="20" width="12" height="44" rx="2" fill="#dfe6ea" stroke="#9fb3bb"/><rect x="42" y="26" width="70" height="32" rx="4" fill="#b8682e"/><g stroke="#8e4d1f" stroke-width="2">
<line x1="50" y1="26" x2="50" y2="58"/><line x1="58" y1="26" x2="58" y2="58"/><line x1="66" y1="26" x2="66" y2="58"/><line x1="74" y1="26" x2="74" y2="58"/><line x1="82" y1="26" x2="82" y2="58"/><line x1="90" y1="26" x2="90" y2="58"/><line x1="98" y1="26" x2="98" y2="58"/><line x1="106" y1="26" x2="106" y2="58"/></g><rect x="112" y="20" width="12" height="44" rx="2" fill="#dfe6ea" stroke="#9fb3bb"/><rect x="140" y="35" width="30" height="14" fill="#d2302a"/><rect x="170" y="35" width="30" height="14" fill="#2756c9"/><text x="155" y="46" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">N</text><text x="185" y="46" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">S</text></svg>
        <b>전자기 유도</b><span>통합과학2 · 자석과 코일로 유도 전류를 만들고 검류계로 확인해요.</span>
      </button>
    </div>
    <div class="seg" role="radiogroup" aria-label="단계">
      <button role="radio" data-lv="0" aria-checked="true">초급</button>
      <button role="radio" data-lv="1" aria-checked="false">중급</button>
      <button role="radio" data-lv="2" aria-checked="false">고급</button>
    </div>
    <p id="lvDesc"></p>
    <button id="btnStart" class="primary big">실험 시작</button>
  </div>
</div>

  const o = h.object.userData.owner; if (!o) return;

});
cvs.addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting || !EXP) return;

  raycaster.setFromCamera(mouse, camera);
  const h = raycaster.intersectObjects(activePickables(), false)[0];

    let id = null;
    if (h && h.object.userData.screen === s) { const b = screenBtnAt(s, h.uv.x * s.cw, (1 - h.uv.y) * s.ch); id = b ? b.id : null; if (b) cur = 'pointer'; }

addEventListener('pointerup', e => {
  if (dragPtr !== null && e.pointerId === dragPtr) { dragPtr = null; deskDrop(); return; }
  if (deskObj && deskObj.squeeze && (deskPtr === null || e.pointerId === deskPtr)) setSqueeze(deskObj, false); deskPtr = null;
});
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }

/* ================= HTML UI: start modal, bar, drawer ================= */
const bar = $('#bar');

}

// drawer
const drawer = $('#drawer'), dBody = $('#dBody');
let drawerDirty = true, drawerLast = 0;
const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (framed) $('#btnCsv').hidden = true;
function toggleDrawer(force) { drawer.hidden = force != null ? !force : !drawer.hidden; drawerDirty = true; renderBar(); }
$('#dClose').addEventListener('click', () => toggleDrawer(false));
$('#dUndo').addEventListener('click', undo); $('#dRedo').addEventListener('click', redo);
$('#nameIn').addEventListener('input', e => { studentName = e.target.value.trim().slice(0, 12); markScreens(); });
function graphSVG(gd) {
  const W = 440, H = 200, px = 44, py = 14, pw = W - 58, ph = H - 50;
  const X = v => px + (v - gd.xMin) / (gd.xMax - gd.xMin || 1) * pw, Y = v => py + ph - (v - gd.yMin) / (gd.yMax - gd.yMin || 1) * ph;
  let s = `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(gd.title)}">`;
  for (let i = 0; i <= 4; i++) { const v = gd.yMin + (gd.yMax - gd.yMin) * i / 4; s += `<line x1="${px}" x2="${px + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${px - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".6">${esc(gd.yFmt ? gd.yFmt(v) : v.toFixed(1))}</text>`; }
  for (let i = 0; i <= 4; i++) { const v = gd.xMin + (gd.xMax - gd.xMin) * i / 4; s += `<text x="${X(v)}" y="${py + ph + 16}" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".6">${esc(gd.xFmt ? gd.xFmt(v) : String(Math.round(v)))}</text>`; }
  s += `<text x="${px + pw / 2}" y="${H - 4}" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity=".75">${esc(gd.xLabel)} · 세로: ${esc(gd.yLabel)}</text>`;
  if (gd.zero != null) s += `<line x1="${px}" x2="${px + pw}" y1="${Y(gd.zero)}" y2="${Y(gd.zero)}" stroke="currentColor" stroke-opacity=".4"/>`;
  if (gd.pts.length) { s += `<polyline fill="none" stroke="${gd.color}" stroke-width="2.5" stroke-linejoin="round" points="${gd.pts.map(([a, b]) => `${X(a).toFixed(1)},${Y(b).toFixed(1)}`).join(' ')}"/>`; if (gd.dots) s += gd.pts.map(([a, b]) => `<circle cx="${X(a)}" cy="${Y(b)}" r="3.5" fill="${gd.color}"/>`).join(''); }
  else s += `<text x="${px + pw / 2}" y="${py + ph / 2}" font-size="12" text-anchor="middle" fill="currentColor" fill-opacity=".55">${esc(gd.empty || '')}</text>`;
  return s + '</svg>';
}
function renderDrawer() {
  if (drawer.hidden || !EXP) return;
  if (drawer.contains(document.activeElement) && document.activeElement.tagName === 'SELECT') return;
  const td = EXP.tableData(), gd = EXP.graphData(), cs = conclState(EXP), ms = EXP.missions();
  const table = td.rows.length ? `<div class="scroll"><table><thead><tr>${td.cols.map(c => `<th>${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${td.rows.map(r => `<tr>${r.map(c => `<td>${c && typeof c === 'object' && c.sw ? `<span class="sw" style="background:${esc(c.sw)}"></span>` : ''}${esc(cellText(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<p class="empty">${esc(td.empty)}</p>`;
  const concl = EXP.conclusions().map(sent => `<p class="cl">${sent.map(p => typeof p === 'string' ? esc(p) : `<select data-c="${p.k}" aria-label="빈칸" class="${cs.filled ? (EXP.cAns[p.k] === p.ans ? 'ok' : 'bad') : ''}"><option value="">고르기</option>${p.opts.map(o => `<option${EXP.cAns[p.k] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`).join('')}</p>`).join('');
  const cmsg = cs.filled ? `<p class="cmsg ${cs.correct ? 'ok' : 'bad'}">${cs.correct ? '결론이 실험 결과와 맞아요.' : '빨간 빈칸을 실험 결과와 비교해 다시 생각해 보세요.'}</p>` : '';
  let pred = '';
  if (EXP === em && em.predict) pred = `<p class="sec">바늘 방향 예측</p>` + EM_SCEN.map((sc, i) => { const r = em.predRes[i], p = em.preds[i]; return `<div class="pred"><span>${esc(sc.t)}${r ? ` — 결과 ${esc(r)} ${r === p ? '✓' : '✗'}` : ''}</span>${['왼쪽', '오른쪽'].map(d => `<button data-pred="${i}" data-d="${d}" aria-pressed="${p === d}">${d}</button>`).join('')}</div>`; }).join('');
  dBody.innerHTML = `<p class="cond">${esc(EXP.name)} · ${esc(LV[state.level])} | ${esc(EXP.conditionText())} | ${esc(TODAY)}</p><p class="sec">실험 결과 (자동 기록)</p>${table}<p class="sec">${esc(gd.title)}</p>${graphSVG(gd)}<p class="sec">결론 정리</p>${concl}${cmsg}${pred}<p class="sec">미션</p><ul class="mis">${ms.map(m => `<li class="${m.done ? 'ok' : ''}"><i>${m.done ? '✓' : ''}</i><span>${esc(m.t)}</span></li>`).join('')}</ul>`;
  drawerDirty = false; drawerLast = performance.now();
}
dBody.addEventListener('change', e => { const sel = e.target.closest('select[data-c]'); if (!sel) return; setConcl(sel.dataset.c, sel.value); sel.blur(); drawerDirty = true; });
dBody.addEventListener('click', e => { const b = e.target.closest('button[data-pred]'); if (!b) return; recordUndo('바늘 방향 예측'); const i = +b.dataset.pred; em.preds[i] = b.dataset.d; em.predRes[i] = null; checkMissions(); });
function exportRows() { const td = EXP.tableData(); return [td.cols.map(c => c.t), ...td.rows.map(r => r.map(cellText))]; }
function flash(btn, text) { const old = btn.textContent; btn.textContent = text; setTimeout(() => { btn.textContent = old; }, 1400); }
$('#btnCopy').addEventListener('click', e => {
  const rows = exportRows(), head = `${EXP.name} (${LV[state.level]}) ${EXP.conditionText()} ${TODAY}${studentName ? ' ' + studentName : ''}`;
  const txt = head + '\n' + rows.map(r => r.join('\t')).join('\n');

  try { navigator.clipboard.writeText(txt).then(() => flash(b, '복사했어요'), () => flash(b, '복사하지 못했어요')); } catch (err) { flash(b, '복사하지 못했어요'); }
});
$('#btnCsv').addEventListener('click', () => {
  const csv = '﻿' + exportRows().map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `${EXP.name}_${LV[state.level]}_결과.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
// start modal
const startEl = $('#start'), stSel = { exp: 'acid', level: 0 };
function renderStart() {

  startEl.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-checked', String(+b.dataset.lv === stSel.level)));

startEl.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => { stSel.exp = b.dataset.exp; renderStart(); }));
startEl.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { stSel.level = +b.dataset.lv; renderStart(); }));
$('#btnStart').addEventListener('click', () => { ensureAudio(); startEl.hidden = true; startExp(stSel.exp, stSel.level); if (innerWidth >= 1200 && drawer.hidden) toggleDrawer(true); });
$('#btnMenu').addEventListener('click', () => { stSel.exp = state.exp; stSel.level = state.level; renderStart(); startEl.hidden = false; });
const intro = $('.intro'), fold = $('#btnFold');
function setFold(min) { intro.classList.toggle('min', min); fold.textContent = min ? '펼치기' : '접기'; fold.setAttribute('aria-expanded', String(!min)); }
fold.addEventListener('click', () => setFold(!intro.classList.contains('min')));

/* ================= audio ================= */
let actx = null;
function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } }
function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
  if (!actx) return; const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function plink(k = 1) { tone(1500 * k, 430 * k, 0.17, 0.16); }
function tick(k = 1) { tone(900 * k, 700 * k, 0.05, 0.05, 'triangle'); }
function chime() { tone(880, 880, 0.25, 0.08, 'sine'); tone(1320, 1320, 0.35, 0.07, 'sine', 0.12); }

/* ================= XR session ================= */
let arMode = false, placed = true, floorRef = true;
const xrNote = $('#xrNote');
async function checkXR() {
  let vr = false, ar = false;
  try { if (navigator.xr) { vr = await navigator.xr.isSessionSupported('immersive-vr'); ar = await navigator.xr.isSessionSupported('immersive-ar'); } } catch (e) { /* blocked */ }
  $('#btnVR').disabled = !vr; $('#btnAR').disabled = !ar;
  if (vr || ar) xrNote.textContent = '헤드셋이 준비됐어요. 버튼을 누르면 실험실로 들어갑니다.';
  else if (!window.isSecureContext) xrNote.textContent = 'XR은 https 주소에서만 켜져요. 지금은 화면 모드로 실행 중입니다.';
  else xrNote.textContent = '이 화면에서는 VR/AR을 켤 수 없어요. 갤럭시 XR·퀘스트3 브라우저에서 이 페이지를 직접 열면 버튼이 켜집니다.';
}
async function enterXR(mode) {
  ensureAudio(); if (deskObj) deskDrop();
  if (!EXP) { startEl.hidden = true; startExp(stSel.exp, stSel.level); }
  let session = null; floorRef = true;
  const opt = ['hand-tracking', 'bounded-floor', 'layers'];
  try { session = await navigator.xr.requestSession(mode, { requiredFeatures: ['local-floor'], optionalFeatures: opt }); }
  catch (e1) {
    try { session = await navigator.xr.requestSession(mode, { optionalFeatures: ['local-floor', ...opt] }); floorRef = !!(session.enabledFeatures && session.enabledFeatures.includes('local-floor')); }
    catch (e2) { xrNote.textContent = `XR을 시작하지 못했어요 (${e2.name || e2}). 헤드셋 브라우저에서 https 주소로 열었는지 확인해 주세요.`; return; }
  }
  arMode = mode === 'immersive-ar';
  room.visible = bench.visible = !arMode; scene.background = arMode ? null : BG; renderer.setClearColor(0x000000, arMode ? 0 : 1);
  renderer.xr.setReferenceSpaceType(floorRef ? 'local-floor' : 'local');
  await renderer.xr.setSession(session);
  placed = false; markScreens();
  session.addEventListener('end', () => {
    arMode = false; room.visible = bench.visible = true; scene.background = BG; renderer.setClearColor(0x000000, 1);
    for (const st of inputs) { if (st.holding) release(st); st.viz.g.visible = false; st.cursor.visible = false; }
    labRoot.position.set(0, 0.9, 0); labRoot.rotation.set(0, 0, 0); placed = true;
    camera.position.copy(CAM0); controls.target.copy(TGT0); markScreens();
  });
}
$('#btnVR').addEventListener('click', () => enterXR('immersive-vr'));
$('#btnAR').addEventListener('click', () => enterXR('immersive-ar'));
function placeLab(frame) {
  const ref = renderer.xr.getReferenceSpace(); if (!ref) return;
  const pose = frame.getViewerPose(ref); if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const fwd = V3(0, 0, -1).applyQuaternion(new THREE.Quaternion(o.x, o.y, o.z, o.w)); fwd.y = 0;
  if (fwd.lengthSq() < 1e-4) fwd.set(0, 0, -1); fwd.normalize();
  labRoot.rotation.set(0, Math.atan2(-fwd.x, -fwd.z), 0);
  labRoot.position.set(p.x + fwd.x * 0.45, floorRef ? clamp(p.y - 0.48, 0.45, 1.3) : p.y - 0.48, p.z + fwd.z * 0.45);
  placed = true; log('실험대를 눈앞에 맞췄어요', true);
}

/* ================= main loop ================= */
let last = performance.now(), lastRead = 0;
function loop(t, frame) {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const xr = renderer.xr.isPresenting;
  if (xr && frame && !placed) placeLab(frame);
  labRoot.updateMatrixWorld(true); labInv.copy(labRoot.matrixWorld).invert();
  if (xr) renderer.xr.getCamera().getWorldPosition(camWorld); else camWorld.copy(camera.position);
  camLab.copy(camWorld).applyMatrix4(labInv);
  if (xr) {
    for (const st of inputs) updateInput(st, dt);
    for (const s of screens) { const h = inputs.map(i => i.hover).find(h => h && h.s === s); setHover(s, h ? h.id : null); }
    updateHeld();
  }
  updateAnims(dt);
  if (EXP) EXP.update(dt, now);
  updateScreens(now);
  if (drawerDirty && now - drawerLast > 300) renderDrawer();
  if (EXP && now - lastRead > 120) { lastRead = now; $('#readText').textContent = EXP.readingText(); }
  if (!xr) controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= boot ================= */
async function boot() {
  try { await Promise.race([document.fonts.load(`700 40px 'Noto Sans KR'`).then(() => document.fonts.load(`900 40px 'Noto Sans KR'`)), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* fallback font */ }
  buildRoom(); buildLights(); buildMat();
  buildPlate(); buildBottles(); buildThermo(); buildEM();
  const g1 = makeScreen(1200, 800, 0.4, 0.2667, V3(-0.32, 0.175, -0.07), drawGuideScreen); g1.page = 'guide';
  makeScreen(1380, 960, 0.46, 0.32, V3(0.38, 0.19, -0.04), drawResultScreen);
  EXP = acid; acid.g.visible = true;
  renderStart(); setQuality(true);
  startExp('acid', 0);
  renderer.setAnimationLoop(loop);
  checkXR();
  const ld = $('#loading'); ld.style.opacity = '0'; setTimeout(() => ld.remove(), 600);
  window.__lab = { acid, em, wells, droppers, startExp, undo, redo, setConcl, acidEvent, deskPick, deskDrop, get thermo() { return thermo; } };
}
boot();
}
