<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XR 지구과학 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: calm lab instrument, plain words for students
   IDEA: a lab bench with an instruction tablet on one side and a results board on the other
   PICTURE: the live 3D bench fills the whole screen

   LAYOUT: full-bleed canvas, card top-left, results panel right, control strip bottom, stacks on phones */
:root{color-scheme:light dark;--card:light-dark(rgba(252,252,250,.92),rgba(18,26,24,.9));--ink:light-dark(#13201c,#e8efec);--sub:light-dark(#4d5a56,#a9b7b2);--line:light-dark(rgba(19,32,28,.13),rgba(232,239,236,.15));--acc:#0e7a66;--acc2:light-dark(#0b6655,#4cc3a8);--btn:light-dark(#eef2f0,#22302c);--ok:#1f8f5f;--bad:#c4412f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd8dc}
body{color:var(--ink);font:16px/1.5 'Noto Sans KR',system-ui,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(10,30,25,.16)}
.intro{position:fixed;top:16px;left:16px;width:min(390px,calc(100vw - 32px));padding:16px 18px 12px;z-index:3}
.ihead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.intro h1{margin:0;font-size:24px;line-height:1.2;font-weight:900}
.lv{margin:2px 0 10px;font-weight:700;color:var(--acc2);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
button[aria-pressed=true]{background:var(--acc2);color:light-dark(#fff,#08201a);border-color:transparent}
#btnFold{min-height:36px;padding:0 12px;font-size:13px;flex:none}
.note{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--sub)}
.intro.min .note,.intro.min details{display:none}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
details ul{margin:6px 0 2px;padding-left:18px;color:var(--sub)}
details li{margin:3px 0}
details b{color:var(--ink)}
.bar{position:fixed;left:16px;right:16px;bottom:16px;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;z-index:3}
.status{position:fixed;right:16px;top:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;width:min(360px,calc(100vw - 32px));font-size:14px;z-index:3}
#statusText{color:var(--sub)}
#readText{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
#drawer{position:fixed;top:96px;right:16px;bottom:92px;width:min(470px,calc(100vw - 32px));padding:16px 18px;z-index:4;display:flex;flex-direction:column;gap:10px}
#drawer[hidden]{display:none}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh h2{margin:0;font-size:21px;font-weight:900}
.dh .row button{min-height:38px;padding:0 12px;font-size:14px}
label.nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
label.nm input{flex:1;font:inherit;font-size:16px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink)}
#dBody{overflow:auto;flex:1;padding-right:4px}
.cond{margin:0;font-size:13.5px;color:var(--sub)}
.sec{font-weight:800;margin:14px 0 6px;font-size:15px}
.scroll{overflow-x:auto}
#dBody table{width:100%;border-collapse:collapse;font-size:14px}
#dBody th{font-size:12.5px;color:var(--sub);font-weight:700}
#dBody th,#dBody td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#dBody th:first-child,#dBody td:first-child{text-align:left}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);margin-right:6px;vertical-align:-1px}
.empty{color:var(--sub);font-size:14px;margin:4px 0}
.cl{margin:6px 0;line-height:2.1;font-size:15px}
.cl select{font:inherit;font-size:16px;min-height:36px;border-radius:8px;border:2px solid var(--line);background:var(--btn);color:var(--ink);padding:0 4px}
.cl select.ok{border-color:var(--ok)}.cl select.bad{border-color:var(--bad)}
.cmsg{font-size:14px;font-weight:700;margin:4px 0}
.cmsg.ok{color:var(--ok)}.cmsg.bad{color:var(--bad)}
.mis{list-style:none;padding:0;margin:4px 0 8px}
.mis li{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:14.5px}
.mis i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;margin-top:1px}
.mis li.ok i{background:var(--acc);border-color:var(--acc)}
.mis li.ok span{color:var(--sub)}
.pred{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0;font-size:14.5px}
.pred span{flex:1 1 160px}
.pred button{min-height:38px;padding:0 12px;font-size:14px}
.graph{width:100%;height:auto;display:block;background:light-dark(#fff,#101816);border-radius:12px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(18,30,27,.38);z-index:8;padding:16px}
.modal[hidden]{display:none}
.mcard{width:min(640px,100%);padding:24px 24px 20px;max-height:calc(100vh - 32px);overflow:auto}
.mcard h2{margin:0 0 6px;font-size:30px;font-weight:900;line-height:1.15}
.mcard>p{margin:0 0 16px;color:var(--sub)}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.picks.one{grid-template-columns:1fr}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px 14px;min-height:140px;border-radius:16px;border:2px solid var(--line);background:var(--btn)}
.pick svg{width:100%;height:70px}
.pick b{font-size:18px}.pick span{font-size:13.5px;font-weight:500;color:var(--sub);line-height:1.4}
.pick[aria-checked=true]{border-color:var(--acc);background:light-dark(#e3f3ee,#173a32)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:5px;border-radius:14px;background:var(--btn);margin-bottom:10px}
.seg button{border:0;background:transparent}
.seg button[aria-checked=true]{background:var(--acc);color:#fff}
#lvDesc{min-height:48px;margin:0 0 14px;font-size:15px;color:var(--sub)}
.big{width:100%;min-height:52px;font-size:17px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#dfe6e8;z-index:9;transition:opacity .5s}
#loading p{margin:14px 0 0;font-weight:700;color:#3b4a46}
.spin{width:44px;height:44px;margin:auto;border-radius:50%;border:4px solid #b9cbc6;border-top-color:#0e7a66;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:760px){.status{top:auto;bottom:calc(16px + 118px);left:16px;width:auto;flex-direction:row;justify-content:space-between;align-items:center}#drawer{top:16px;bottom:16px;z-index:6}.picks{grid-template-columns:1fr}.pick{min-height:0}}
@media(max-width:520px){.bar{bottom:8px;gap:6px;padding:8px}.bar button{padding:0 11px;font-size:14px}}
</style>

<body>
<div id="stage"></div>
<div id="loading"><div><div class="spin"></div><p>실험실을 준비하고 있어요…</p></div></div>
<header class="card intro">

    <button id="btnAR" disabled>패스스루(AR)</button>

  </div>

</header>
<div class="card status"><span id="statusText">실험을 골라 시작하세요.</span><span id="readText">–</span></div>
<nav class="card bar" id="bar" aria-label="실험 도구"></nav>
<aside id="drawer" class="card" hidden aria-label="탐구 결과 기록">
  <div class="dh"><h2>탐구 결과 기록</h2><div class="row"><button id="dUndo">되돌리기</button><button id="dRedo">다시 실행</button><button id="dClose">닫기</button></div></div>
  <label class="nm">이름 <input id="nameIn" maxlength="12" autocomplete="off" placeholder="기록지에 들어갈 이름"></label>
  <div id="dBody"></div>
  <div class="row"><button id="btnCopy">표 복사</button><button id="btnCsv">CSV 저장</button></div>
</aside>
<div id="start" class="modal">
  <div class="card mcard" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">XR 지구과학 실험실</h2>
    <p>실험과 단계를 고르세요. 헤드셋에서는 시작한 뒤 VR 버튼을 누르면 됩니다.</p>
    <div class="picks one" role="radiogroup" aria-label="실험">
      <button class="pick" role="radio" data-exp="deep" aria-checked="true">
        <svg viewBox="0 0 220 70" aria-hidden="true"><rect x="8" y="10" width="204" height="56" rx="3" fill="#eef7fb" stroke="#9fb3bb" stroke-width="2"/><rect x="10" y="40" width="200" height="24" fill="#d9eef5"/><rect x="18" y="12" width="28" height="27" fill="#2b54c9" opacity=".85"/><rect x="15" y="4" width="3" height="40" fill="#5c6b70"/><path d="M12 42 C 16 52, 14 60, 24 61 C 60 63, 90 60, 120 61 C 132 61, 128 55, 140 58 C 146 60, 150 62, 152 63 L 12 63 Z" fill="#2b54c9" opacity=".75"/></svg>
        <b>심층 순환의 발생 원리</b><span>고2 지구과학 · 23쪽 해 보기 — 차가운 소금물이 가라앉아 바닥을 따라 이동하는 모습을 관찰해요.</span>
      </button>
    </div>
    <div class="seg" role="radiogroup" aria-label="단계">
      <button role="radio" data-lv="0" aria-checked="true">초급</button>
      <button role="radio" data-lv="1" aria-checked="false">중급</button>
      <button role="radio" data-lv="2" aria-checked="false">고급</button>
    </div>
    <p id="lvDesc"></p>
    <button id="btnStart" class="primary big">실험 시작</button>
  </div>
</div>

function overBeaker(p, pad = 0) { const b = deep.bk.root.position; return !deep.bk.held && !deep.bk.desk && Math.hypot(p.x - b.x, p.z - b.z) < BK.ri + pad; }

function inTankXZ(p, pad = 0.004) { return p.x > DS.X0 + pad && p.x < DS.X0 + DS.L - pad && Math.abs(p.z - DS.Z) < DS.D / 2 - pad; }

function deskTool(o, rest, upright) {

  if (o.kind === 'tongs') { if (overIce(hit)) ty = 0.016; else if (overBeaker(hit, -0.006)) ty = BK.h + 0.004; }

function placeLab(frame) {
  const ref = renderer.xr.getReferenceSpace(); if (!ref) return;
  const pose = frame.getViewerPose(ref); if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const fwd = V3(0, 0, -1).applyQuaternion(new THREE.Quaternion(o.x, o.y, o.z, o.w)); fwd.y = 0;
  if (fwd.lengthSq() < 1e-4) fwd.set(0, 0, -1); fwd.normalize();
  labRoot.rotation.set(0, Math.atan2(-fwd.x, -fwd.z), 0);
  labRoot.position.set(p.x + fwd.x * 0.45, floorRef ? clamp(p.y - 0.48, 0.45, 1.3) : p.y - 0.48, p.z + fwd.z * 0.45);
  placed = true; log('실험대를 눈앞에 맞췄어요', true);
}

/* ================= main loop ================= */
let last = performance.now(), lastRead = 0;
function loop(t, frame) {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const xr = renderer.xr.isPresenting;
  if (xr && frame && !placed) placeLab(frame);
  labRoot.updateMatrixWorld(true); labInv.copy(labRoot.matrixWorld).invert();
  if (xr) renderer.xr.getCamera().getWorldPosition(camWorld); else camWorld.copy(camera.position);
  camLab.copy(camWorld).applyMatrix4(labInv);
  if (xr) {
    for (const st of inputs) updateInput(st, dt);
    for (const s of screens) { const h = inputs.map(i => i.hover).find(h => h && h.s === s); setHover(s, h ? h.id : null); }
    updateHeld(dt);
  }
  updateAnims(dt);
  { const bt = arMode ? 0 : blackoutT; if (Math.abs(blackout - bt) > 0.002) applyBlackout(Math.abs(blackout - bt) < 0.01 ? bt : blackout + (bt - blackout) * Math.min(1, dt * 1.5)); }
  if (shadowDirty || deskObj || inputs.some(s => s.holding) || allGrabs.some(o => o.anim) || (EXP && EXP.needShadow && EXP.needShadow())) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  if (EXP) EXP.update(dt, now);
  updateScreens(now);
  if (drawerDirty && now - drawerLast > 300) renderDrawer();
  if (EXP && now - lastRead > 120) { lastRead = now; $('#readText').textContent = EXP.readingText(); }
  if (!xr) controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= boot ================= */
async function boot() {
  try { await Promise.race([document.fonts.load(`700 40px 'Noto Sans KR'`).then(() => document.fonts.load(`900 40px 'Noto Sans KR'`)), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* fallback font */ }
  buildRoom(); buildLights(); buildMat();
  const g1 = makeScreen(1200, 800, 0.4, 0.2667, V3(-0.6, 0.19, -0.02), drawGuideScreen); g1.page = 'guide';
  makeScreen(1380, 960, 0.46, 0.32, V3(0.62, 0.2, -0.02), drawResultScreen);
  buildDeep();
  if (!FS.ok) log('이 기기에서는 물의 흐름 계산(GPU)이 지원되지 않아요', true);
  EXP = deep; deep.g.visible = true;
  renderStart(); setQuality(true);
  startExp('deep', 0);
  renderer.setAnimationLoop(loop);
  checkXR();
  const ld = $('#loading'); ld.style.opacity = '0'; setTimeout(() => ld.remove(), 600);
  window.__lab = { camera, controls, deep, FS, DS, startExp, undo, redo, setConcl, deskPick, deskDrop, quickPrep, setLift, fsStep };
}
boot();
}
